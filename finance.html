<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIGURAX - Financial Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #059669; --bg: #f8fafc; --text: #0f172a; --card: #ffffff; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--card); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .login-box input, .login-box select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; }
        .hidden { display: none !important; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: var(--card); padding: 1rem; border-radius: 8px; }
        .btn { padding: 8px 16px; background: var(--primary); color: white; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; }
        .btn-back { background: #64748b; margin-left: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--card); padding: 1.5rem; border-radius: 8px; text-align: center; }
        .form-section { background: var(--card); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; font-weight: 600; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 1rem;">FIGURAX FINANCE</h2>
            <p style="margin-bottom: 1.5rem; color: #64748b;">تسجيل الدخول للإدارة المالية</p>
            <input type="password" id="finance-password" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <a href="admin.html" style="display: block; margin-top: 1rem; color: #64748b; text-decoration: none;">← العودة للوحة التحكم</a>
        </div>
    </div>

    <!-- لوحة المالية -->
    <div id="finance-dashboard" class="hidden">
        <header>
            <h2>FIGURAX FINANCE</h2>
            <div>
                <a href="admin.html" class="btn btn-back">← العودة للوحة التحكم</a>
                <button onclick="logout()" class="btn" style="background: var(--danger);">خروج</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الإيرادات</h3>
                <p id="total-income" style="font-size: 2rem; font-weight: bold; color: var(--primary);">0 EGP</p>
            </div>
            <div class="stat-card">
                <h3>إجمالي المصروفات</h3>
                <p id="total-expense" style="font-size: 2rem; font-weight: bold; color: var(--danger);">0 EGP</p>
            </div>
            <div class="stat-card">
                <h3>صافي الربح</h3>
                <p id="net-profit" style="font-size: 2rem; font-weight: bold; color: #0f172a;">0 EGP</p>
            </div>
        </div>

        <div class="form-section">
            <h3 style="margin-bottom: 1rem;">تسجيل معاملة مالية</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>نوع المعاملة *</label>
                    <select id="trans-type"><option value="income">إيراد (داخلي)</option><option value="expense">مصروف (خارجي)</option></select>
                </div>
                <div class="form-group">
                    <label>الفئة</label>
                    <select id="trans-category">
                        <option value="operations">عمليات تسويق</option>
                        <option value="salaries">رواتب</option>
                        <option value="rent">إيجار</option>
                        <option value="supplies">مستلزمات</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                <div class="form-group"><label>المبلغ (EGP) *</label><input type="number" id="trans-amount"></div>
                <div class="form-group"><label>التاريخ</label><input type="date" id="trans-date"></div>
                <div class="form-group" style="grid-column: 1 / -1;"><label>الوصف *</label><input type="text" id="trans-desc"></div>
            </div>
            <button onclick="addTransaction()" class="btn" style="margin-top: 1rem; width: 100%;">حفظ المعاملة</button>
        </div>

        <div class="form-section">
            <h3 style="margin-bottom: 1rem;">سجل الحركات المالية</h3>
            <table id="finance-table">
                <thead><tr><th>التاريخ</th><th>النوع</th><th>الفئة</th><th>الوصف</th><th>المبلغ</th><th>الحالة</th></tr></thead>
                <tbody><tr><td colspan="6" style="text-align: center;">جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXDGLMtulxN23kDkNqDPPX7JYaJtOL4A15tN_u1apnjhe4jJvhlkDgvFas943gj9jy0w/exec';
        const FINANCE_PASS = '123456'; // يمكنك تغييرها لتختلف عن الأدمن إذا أردت

        async function api(action, method = 'GET', body = null) {
            const url = `${SCRIPT_URL}?action=${action}`;
            const options = {
                method: method,
                redirect: 'follow', // حل مشكلة CORS
                headers: method === 'POST' ? { 'Content-Type': 'text/plain;charset=utf-8' } : {}
            };
            if (body) options.body = JSON.stringify(body);

            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`API Error [${action}]:`, error);
                throw error;
            }
        }

        function checkAuth() {
            if (localStorage.getItem('figurax_finance_auth') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('finance-dashboard').classList.remove('hidden');
                loadFinancials();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('finance-dashboard').classList.add('hidden');
            }
        }

        function login() {
            if (document.getElementById('finance-password').value === FINANCE_PASS) {
                localStorage.setItem('figurax_finance_auth', 'true');
                checkAuth();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function logout() {
            localStorage.removeItem('figurax_finance_auth');
            window.location.reload();
        }

        async function loadFinancials() {
            try {
                const data = await api('getFinancials');
                if (data.success) {
                    document.getElementById('total-income').innerText = data.summary.income + ' EGP';
                    document.getElementById('total-expense').innerText = data.summary.expense + ' EGP';
                    document.getElementById('net-profit').innerText = data.summary.profit + ' EGP';
                    
                    const tbody = document.querySelector('#finance-table tbody');
                    tbody.innerHTML = '';
                    data.transactions.forEach(t => {
                        const color = t.type === 'income' ? 'var(--primary)' : 'var(--danger)';
                        tbody.innerHTML += `<tr>
                            <td>${t.date}</td>
                            <td style="color: ${color}; font-weight: bold;">${t.type === 'income' ? 'إيراد' : 'مصروف'}</td>
                            <td>${t.category}</td>
                            <td>${t.desc}</td>
                            <td>${t.amount} EGP</td>
                            <td>مكتمل</td>
                        </tr>`;
                    });
                }
            } catch (e) { console.error('Load Financials Error:', e); }
        }

        async function addTransaction() {
            const trans = {
                type: document.getElementById('trans-type').value,
                category: document.getElementById('trans-category').value,
                amount: document.getElementById('trans-amount').value,
                date: document.getElementById('trans-date').value || new Date().toISOString().split('T')[0],
                desc: document.getElementById('trans-desc').value
            };
            if (!trans.amount || !trans.desc) return alert('يرجى ملء المبلغ والوصف');

            await api('addTransaction', 'POST', trans);
            alert('تم حفظ المعاملة بنجاح');
            loadFinancials();
            // Clear form
            document.getElementById('trans-amount').value = '';
            document.getElementById('trans-desc').value = '';
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
