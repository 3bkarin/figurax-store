<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/inter/v19/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hjp-Ek-_EeA.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

  * {

    padding: 0;
    box-sizing: border-box;

  :root {
    --primary: #C41E3A;
    --bg: #0a0a0a;
    --card: #111;
    --border: #2a2a2a;
    --text: #E8E8E8;
    --muted: #A0A0A0;

    --danger: #ff4444;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .topbar {
    background: rgba(10, 10, 10, 0.95);
    border-bottom: 1px solid var(--border);
    padding: 15px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .topbar-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 22px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: 2px;
  }

  .logo span {
    color: var(--text);
  }

  .nav-back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }

  .nav-back:hover {
    color: var(--primary);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    padding: 25px 0;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .stat-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 900;
    color: var(--primary);
  }

  .stat-value.success {
    color: var(--success);
  }

  .stat-value.danger {
    color: var(--danger);
  }

  .panel-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 25px;
  }

  .panel-card h3 {
    margin-bottom: 20px;
    font-size: 18px;
    color: var(--text);
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
  }

  .submit-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }

  .submit-btn:hover {
    background: #a01830;
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .table-wrapper {
    overflow-x: auto;
    margin-top: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th,
  td {
    padding: 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }

  th {
    background: var(--bg);
    color: var(--primary);
    text-transform: uppercase;
    font-size: 11px;
  }

  tr:hover td {
    background: rgba(255,255,255,0.02);
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: var(--success);
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 600;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
  }

  .toast.error {
    background: var(--danger);
  }

  .toast.show {
    opacity: 1;
  }

  .filter-row {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .filter-row .form-group {
    margin: 0;
    flex: 1;
    min-width: 180px;
  }

  @media (max-width: 600px) {
    .container {
      padding: 0 12px;
    }

    .panel-card {
      padding: 18px;
    }

    .stats-grid {
      grid-template-columns: 1fr;
    }

    .topbar-content {
      gap: 15px;
    }

    .logo {
      font-size: 18px;
    }
  }
</style>

</head>

<script>

/* =========================================================
   FIGURAX GOOGLE APPS SCRIPT API
   ========================================================= */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbyXDGLMtulxN23kDkNqDPPX7JYaJtOL4A15tN_u1apnjhe4jJvhlkDgvFas943gj9jy0w/exec';


/* =========================================================
   API FUNCTION
   GET  -> Query Parameters
   POST -> FormData
   ========================================================= */

async function api(action, payload = {}, method = 'POST') {

  try {

    let res;

    /* =========================
       GET REQUEST
       ========================= */

    if (method.toUpperCase() === 'GET') {

      const params = new URLSearchParams();

      params.append('action', action);

      Object.entries(payload).forEach(([key, value]) => {

        if (
          value !== undefined &&
          value !== null &&
          value !== ''
        ) {
          params.append(
            key,
            typeof value === 'object'
              ? JSON.stringify(value)
              : String(value)
          );
        }

      });

      const url =
        `${APPS_SCRIPT_URL}?${params.toString()}`;

      console.log('GET API:', url);

      res = await fetch(url, {
        method: 'GET',
        redirect: 'follow'
      });

    }

    /* =========================
       POST REQUEST
       ========================= */

    else {

      const formData = new FormData();

      formData.append('action', action);

      Object.entries(payload).forEach(([key, value]) => {

        formData.append(
          key,
          typeof value === 'object'
            ? JSON.stringify(value)
            : value ?? ''
        );

      });

      console.log('POST API:', action, payload);

      res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: formData,
        redirect: 'follow'
      });

    }

    /* =========================
       HTTP ERROR
       ========================= */

    if (!res.ok) {
      throw new Error(
        `HTTP Error ${res.status}`
      );
    }

    /* =========================
       JSON RESPONSE
       ========================= */

    const data = await res.json();

    console.log('API Response:', data);

    if (!data.success) {

      throw new Error(
        data.data?.error ||
        data.error ||
        'Request failed'
      );

    }

    return data.data;

  } catch (error) {

    console.error(
      `API Error [${action}]:`,
      error
    );

    throw error;

  }

}


/* =========================================================
   LOAD FINANCIAL RECORDS
   ========================================================= */

async function loadFinancials() {

  const tbody =
    document.getElementById('financeTable');

  try {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="7"
          style="text-align:center; color:var(--muted);"
        >
          جاري تحميل البيانات...
        </td>
      </tr>
    `;

    const payload = {};

    const startDate =
      document.getElementById('filterStartDate').value;

    const endDate =
      document.getElementById('filterEndDate').value;

    const type =
      document.getElementById('filterType').value;


    if (startDate) {
      payload.startDate = startDate;
    }

    if (endDate) {
      payload.endDate = endDate;
    }

    if (type) {
      payload.type = type;
    }


    /* GET request */

    const result =
      await api(
        'getFinancials',
        payload,
        'GET'
      );


    const financials =
      Array.isArray(result?.financials)
        ? result.financials
        : [];


    let rev = 0;
    let exp = 0;


    /* =========================
       EMPTY DATA
       ========================= */

    if (financials.length === 0) {

      tbody.innerHTML = `
        <tr>
          <td
            colspan="7"
            style="text-align:center; color:var(--muted);"
          >
            لا توجد حركات مالية مسجلة
          </td>
        </tr>
      `;

    }

    /* =========================
       DATA
       ========================= */

    else {

      tbody.innerHTML =
        financials.map(r => {

          const amount =
            Number(r.amount || 0);

          const isRevenue =
            String(r.type).toLowerCase() === 'revenue';


          if (isRevenue) {
            rev += amount;
          } else {
            exp += amount;
          }


          return `
            <tr>

              <td>
                ${escapeHtml(r.date || '-')}
              </td>

              <td>
                <span
                  style="
                    color:${isRevenue
                      ? 'var(--success)'
                      : 'var(--danger)'};
                    font-weight:700;
                  "
                >
                  ${isRevenue ? 'إيراد' : 'مصروف'}
                </span>
              </td>

              <td>
                ${escapeHtml(r.category || '-')}
              </td>

              <td>
                ${escapeHtml(r.description || '-')}
              </td>

              <td
                style="
                  color:${isRevenue
                    ? 'var(--success)'
                    : 'var(--danger)'};
                  font-weight:700;
                "
              >
                ${amount.toLocaleString()} EGP
              </td>

              <td>
                ${escapeHtml(r.referenceId || '-')}
              </td>

              <td>
                ${escapeHtml(r.status || 'معلق')}
              </td>

            </tr>
          `;

        }).join('');

    }


    /* =========================
       UPDATE STATISTICS
       ========================= */

    document.getElementById(
      'totalRevenue'
    ).textContent =
      rev.toLocaleString() + ' EGP';


    document.getElementById(
      'totalExpenses'
    ).textContent =
      exp.toLocaleString() + ' EGP';


    const net =
      rev - exp;


    const netEl =
      document.getElementById('netProfit');


    netEl.textContent =
      net.toLocaleString() + ' EGP';


    netEl.className =
      'stat-value ' +
      (net >= 0
        ? 'success'
        : 'danger');


  } catch (err) {

    console.error(
      'Load Financials Error:',
      err
    );


    tbody.innerHTML = `
      <tr>
        <td
          colspan="7"
          style="
            text-align:center;
            color:var(--danger);
            padding:25px;
          "
        >
          فشل تحميل السجلات المالية
        </td>
      </tr>
    `;


    showToast(
      err.message ||
      'فشل تحميل السجلات المالية',
      true
    );

  }

}


/* =========================================================
   ADD FINANCIAL RECORD
   ========================================================= */

async function addFinancialRecord(e) {

  e.preventDefault();


  const button =
    document.getElementById(
      'saveFinancialBtn'
    );


  try {

    button.disabled = true;
    button.textContent =
      'جاري الحفظ...';


    const type =
      document.getElementById(
        'transType'
      ).value;


    const amount =
      Number(
        document.getElementById(
          'transAmount'
        ).value
      );


    const category =
      document.getElementById(
        'transCategory'
      ).value;


    const description =
      document.getElementById(
        'transDescription'
      ).value.trim();


    const date =
      document.getElementById(
        'transDate'
      ).value ||
      getTodayDate();


    if (!amount || amount <= 0) {

      throw new Error(
        'من فضلك أدخل مبلغ صحيح'
      );

    }


    if (!description) {

      throw new Error(
        'من فضلك أدخل وصف المعاملة'
      );

    }


    await api(
      'addFinancial',
      {
        type,
        amount,
        category,
        description,
        date
      },
      'POST'
    );


    showToast(
      'تم تسجيل المعاملة بنجاح'
    );


    e.target.reset();


    /* إعادة التاريخ لليوم */

    document.getElementById(
      'transDate'
    ).value =
      getTodayDate();


    await loadFinancials();


  } catch (err) {

    console.error(
      'Add Financial Error:',
      err
    );


    showToast(
      err.message ||
      'فشل تسجيل المعاملة',
      true
    );

  } finally {

    button.disabled = false;

    button.textContent =
      'حفظ المعاملة';

  }

}


/* =========================================================
   TODAY DATE
   ========================================================= */

function getTodayDate() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, '0');

  const day =
    String(
      now.getDate()
    ).padStart(2, '0');


  return `${year}-${month}-${day}`;

}


/* =========================================================
   HTML ESCAPE
   Prevents broken HTML / unsafe content
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(
  msg,
  isError = false
) {

  const toast =
    document.getElementById('toast');


  toast.textContent =
    msg;


  toast.classList.toggle(
    'error',
    isError
  );


  toast.classList.add(
    'show'
  );


  setTimeout(() => {

    toast.classList.remove(
      'show'
    );

  }, 2500);

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  () => {

    /* Set today's date */

    const dateInput =
      document.getElementById(
        'transDate'
      );

    if (dateInput) {
      dateInput.value =
        getTodayDate();
    }


    /* Load financial data */

    loadFinancials();

  }
);

</script>
