<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIGURAX - Financial Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/inter/v19/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hjp-Ek-_EeA.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #C41E3A;
  --bg: #0a0a0a;
  --card: #111;
  --border: #2a2a2a;
  --text: #E8E8E8;
  --muted: #A0A0A0;
  --success: #00b894;
  --danger: #ff4444;
}
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.topbar {
  background: rgba(10, 10, 10, 0.95);
  border-bottom: 1px solid var(--border);
  padding: 15px 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
.topbar-content { display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 22px; font-weight: 900; color: var(--primary); letter-spacing: 2px; }
.nav-back { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; }
.nav-back:hover { color: var(--primary); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; padding: 25px 0; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
.stat-value { font-size: 28px; font-weight: 900; color: var(--primary); }
.stat-value.success { color: var(--success); }
.stat-value.danger { color: var(--danger); }

.panel-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 25px; margin-bottom: 25px; }
.panel-card h3 { margin-bottom: 20px; font-size: 18px; color: var(--text); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; font-size: 14px;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
.submit-btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.submit-btn:hover { background: #a01830; }

.table-wrapper { overflow-x: auto; margin-top: 15px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
th { background: var(--bg); color: var(--primary); text-transform: uppercase; font-size: 11px; }

.toast {
  position: fixed; bottom: 20px; left: 20px; background: var(--success); color: white; padding: 12px 20px; border-radius: 6px; font-weight: 600; z-index: 1000; opacity: 0; transition: 0.3s;
}
.toast.error { background: var(--danger); }
.toast.show { opacity: 1; }

.filter-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-row .form-group { margin: 0; flex: 1; min-width: 180px; }
</head>
<body>

<header class="topbar">
  <div class="container">
    <div class="topbar-content">
      <div class="logo">FIGURAX <span>FINANCE</span></div>
      <a href="admin.html" class="nav-back">← العودة للوحة التحكم</a>
    </div>
  </div>
</header>

<div class="container">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">إجمالي الإيرادات</div>
      <div class="stat-value success" id="totalRevenue">0 EGP</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">إجمالي المصروفات</div>
      <div class="stat-value danger" id="totalExpenses">0 EGP</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">صافي الربح</div>
      <div class="stat-value" id="netProfit">0 EGP</div>
    </div>
  </div>

  <!-- إضافة معاملة مالية -->
  <div class="panel-card">
    <h3>تسجيل معاملة مالية (إيراد / مصروف)</h3>
    <form onsubmit="addFinancialRecord(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="transType">نوع المعاملة *</label>
          <select id="transType" required>
            <option value="Revenue">إيراد (داخلي)</option>
            <option value="Expense">مصروف (خارجي)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="transCategory">الفئة</label>
          <select id="transCategory">
            <option value="">-- اختر الفئة --</option>
            <option value="Operations">عمليات</option>
            <option value="Marketing">تسويق</option>
            <option value="Salaries">رواتب</option>
            <option value="Rent">إيجار</option>
            <option value="Supplies">مستلزمات</option>
            <option value="Other">أخرى</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="transAmount">المبلغ (EGP) *</label>
          <input type="number" id="transAmount" min="0" step="0.01" required>
        </div>
<div class="form-group">
        <label for="transDate">التاريخ</label>
        <input type="date" id="transDate">
      </div>
    </div>
    <div class="form-group">
      <label for="transDescription">الوصف *</label>
      <input type="text" id="transDescription" required placeholder="مثال: شراء خامات طباعة 3D / خيوط PLA">
    </div>
    <button type="submit" class="submit-btn">حفظ المعاملة</button>
  </form>
</div>

<!-- سجل المعاملات المالية -->
<div class="panel-card">
  <h3>سجل الحركات المالية</h3>
  <div class="filter-row">
    <div class="form-group">
      <label for="filterStartDate">من تاريخ</label>
      <input type="date" id="filterStartDate">
    </div>
    <div class="form-group">
      <label for="filterEndDate">إلى تاريخ</label>
      <input type="date" id="filterEndDate">
    </div>
    <div class="form-group">
      <label for="filterType">النوع</label>
      <select id="filterType">
        <option value="">الكل</option>
        <option value="Revenue">إيرادات</option>
        <option value="Expense">مصروفات</option>
      </select>
      </div>
      <button class="submit-btn" style="margin-top: 24px;" onclick="loadFinancials()">تصفية</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>النوع</th>
            <th>الفئة</th>
            <th>الوصف</th>
            <th>المبلغ</th>
            <th>المرجع</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="financeTable">
          <tr><td colspan="7" style="text-align:center; color:var(--muted);">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ⚠️ REPLACE WITH YOUR DEPLOYED /exec URL (GAS must be deployed with "Anyone" access)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXDGLMtulxN23kDkNqDPPX7JYaJtOL4A15tN_u1apnjhe4jJvhlkDgvFas943gj9jy0w/exec';

// Unified API caller - handles both JSON and FormData
async function api(action, payload = {}, method = 'POST') {
  const formData = new FormData();
  formData.append('action', action);
  Object.entries(payload).forEach(([key, value]) => {
    formData.append(key, typeof value === 'object' ? JSON.stringify(value) : value);
  });
  
  const res = await fetch(APPS_SCRIPT_URL, { method, body: formData });
  const data = await res.json();
  if (!data.success) throw new Error(data.data?.error || 'Request failed');
  return data.data;
}

async function loadFinancials() {
  try {
    const payload = {};
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    const type = document.getElementById('filterType').value;
    
    if (startDate) payload.startDate = startDate;
    if (endDate) payload.endDate = endDate;
    if (type) payload.type = type;
    
    const { financials } = await api('getFinancials', payload, 'GET');
    let rev = 0, exp = 0;
    
    const tbody = document.getElementById('financeTable');
    if (financials.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--muted);">لا توجد حركات مالية مسجلة</td></tr>';
    } else {
      tbody.innerHTML = financials.map(r => {
        const amount = Number(r.amount || 0);
        const isRevenue = r.type === 'Revenue';
        
        if (isRevenue) rev += amount;
        else exp += amount;
        
        return `
          <tr>
            <td>${r.date || '-'}</td>
            <td><span style="color:${isRevenue ? 'var(--success)' : 'var(--danger)'}; font-weight:700;">${r.type === 'Revenue' ? 'إيراد' : 'مصروف'}</span></td>
            <td>${r.category || '-'}</td>
            <td>${r.description || '-'}</td>
            <td style="color:${isRevenue ? 'var(--success)' : 'var(--danger)'}; font-weight:700;">${amount.toLocaleString()} EGP</td>
            <td>${r.referenceId || '-'}</td>
            <td>${r.status || 'معلق'}</td>
          </tr>
        `;
      }).join('');
    }
    
    document.getElementById('totalRevenue').textContent = rev.toLocaleString() + ' EGP';
    document.getElementById('totalExpenses').textContent = exp.toLocaleString() + ' EGP';
    const net = rev - exp;
    const netEl = document.getElementById('netProfit');
    netEl.textContent = net.toLocaleString() + ' EGP';
    netEl.className = 'stat-value ' + (net >= 0 ? 'success' : 'danger');
  } catch (err) {
    console.error(err);
    showToast('فشل تحميل السجلات المالية', true);
  }
}

async function addFinancialRecord(e) {
  e.preventDefault();
  try {
    await api('addFinancial', {
      type: document.getElementById('transType').value,
      amount: Number(document.getElementById('transAmount').value),
      category: document.getElementById('transCategory').value,
      description: document.getElementById('transDescription').value,
      date: document.getElementById('transDate').value || new Date().toISOString().split('T')[0]
    });
    showToast('تم تسجيل المعاملة بنجاح');
    e.target.reset();
    loadFinancials();
  } catch (err) { showToast(err.message || 'فشل التسجيل', true); }
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

loadFinancials();
</script>
</body>
</style>
</html>
