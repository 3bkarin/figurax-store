<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIGURAX - Admin Dashboard</title>
    <!-- إصلاح الخطوط باستخدام Google Fonts الرسمي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #0f172a; --card: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--card); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; }
        .login-box button:hover { background: #1d4ed8; }
        .hidden { display: none !important; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: var(--card); padding: 1rem; border-radius: 8px; }
        .btn { padding: 8px 16px; background: var(--primary); color: white; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; }
        .btn-danger { background: #ef4444; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; margin-top: 1rem; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; font-weight: 600; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 1rem;">FIGURAX ADMIN</h2>
            <p style="margin-bottom: 1.5rem; color: #64748b;">لوحة التحكم الإدارية</p>
            <input type="password" id="admin-password" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <a href="index.html" style="display: block; margin-top: 1rem; color: #64748b; text-decoration: none;">← العودة للمتجر</a>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard" class="hidden">
        <header>
            <h2>FIGURAX ADMIN</h2>
            <div>
                <button onclick="logout()" class="btn btn-danger">خروج</button>
            </div>
        </header>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
            <div style="background: var(--card); padding: 1.5rem; border-radius: 8px; text-align: center;">
                <h3>إجمالي المنتجات</h3>
                <p id="total-products" style="font-size: 2rem; font-weight: bold; color: var(--primary);">0</p>
            </div>
            <div style="background: var(--card); padding: 1.5rem; border-radius: 8px; text-align: center;">
                <h3>الطلبات الواردة</h3>
                <p id="total-orders" style="font-size: 2rem; font-weight: bold; color: #10b981;">0</p>
            </div>
        </div>

        <div style="background: var(--card); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
            <h3 style="margin-bottom: 1rem;">➕ إضافة منتج جديد</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div class="form-group"><label>اسم المنتج *</label><input type="text" id="prod-name"></div>
                <div class="form-group"><label>القسم *</label><input type="text" id="prod-category"></div>
                <div class="form-group"><label>السعر (EGP) *</label><input type="number" id="prod-price"></div>
                <div class="form-group"><label>الكمية بالمخزن *</label><input type="number" id="prod-stock"></div>
                <div class="form-group"><label>رابط الصورة</label><input type="text" id="prod-image"></div>
            </div>
            <button onclick="addProduct()" class="btn" style="margin-top: 1rem;">حفظ وإضافة المنتج</button>
        </div>

        <h3>مخزون المنتجات</h3>
        <table id="products-table">
            <thead><tr><th>المعرف</th><th>الاسم</th><th>السعر</th><th>المخزن</th><th>الإجراءات</th></tr></thead>
            <tbody><tr><td colspan="5" style="text-align: center;">جاري التحميل...</td></tr></tbody>
        </table>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXDGLMtulxN23kDkNqDPPX7JYaJtOL4A15tN_u1apnjhe4jJvhlkDgvFas943gj9jy0w/exec';
        const ADMIN_PASS = '123456'; // غيّر كلمة المرور هنا إذا أردت

        // دالة الاتصال المصححة لحل مشكلة CORS
        async function api(action, method = 'GET', body = null) {
            const url = `${SCRIPT_URL}?action=${action}`;
            const options = {
                method: method,
                redirect: 'follow', // هذا هو الحل السحري لمشكلة CORS مع Google Apps Script
                headers: method === 'POST' ? { 'Content-Type': 'text/plain;charset=utf-8' } : {}
            };
            if (body) options.body = JSON.stringify(body);

            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`API Error [${action}]:`, error);
                alert('حدث خطأ في الاتصال بالخادم، تأكد من إعدادات Google Apps Script');
                throw error;
            }
        }

        function checkAuth() {
            if (localStorage.getItem('figurax_admin_auth') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        }

        function login() {
            const pass = document.getElementById('admin-password').value;
            if (pass === ADMIN_PASS) {
                localStorage.setItem('figurax_admin_auth', 'true');
                checkAuth();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function logout() {
            localStorage.removeItem('figurax_admin_auth');
            window.location.reload();
        }

        async function loadData() {
            try {
                const data = await api('getAdminData');
                if (data.success) {
                    document.getElementById('total-products').innerText = data.products.length;
                    document.getElementById('total-orders').innerText = data.orders.length;
                    
                    const tbody = document.querySelector('#products-table tbody');
                    tbody.innerHTML = '';
                    data.products.forEach(p => {
                        tbody.innerHTML += `<tr>
                            <td>${p.id}</td>
                            <td>${p.name}</td>
                            <td>${p.price} EGP</td>
                            <td>${p.stock}</td>
                            <td><button class="btn btn-danger" onclick="deleteProduct('${p.id}')">حذف</button></td>
                        </tr>`;
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function addProduct() {
            const product = {
                name: document.getElementById('prod-name').value,
                category: document.getElementById('prod-category').value,
                price: document.getElementById('prod-price').value,
                stock: document.getElementById('prod-stock').value,
                image: document.getElementById('prod-image').value
            };
            if (!product.name || !product.price) return alert('يرجى ملء الحقول المطلوبة');
            
            await api('addProduct', 'POST', product);
            alert('تمت إضافة المنتج بنجاح');
            loadData();
        }

        async function deleteProduct(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await api('deleteProduct', 'POST', { id });
                loadData();
            }
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
